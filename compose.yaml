# Roadmap §68 — the tested versions, and the only place they are written down.
#
# Five of the six components §68 names are pinned by the `image:` tags below and
# need nothing else. **WooCommerce is the sixth and nothing pinned it**: it is a
# plugin installed into the `wordpress_data` volume, which is not
# version-controlled, so `wp plugin install woocommerce` takes whatever is
# current — exactly the "do not depend indefinitely on latest" §68 warns about,
# arriving through the one component that has no tag to pin.
#
# So it is declared here, beside the image pins, rather than in a table in a
# document that would drift from them. `scripts/test.sh versions` reads this
# file and compares it against the stack that is actually running, which is what
# makes it a record rather than a claim. §66's setup.sh will install this
# version rather than the current one.
x-tested-versions:
  woocommerce: "11.0.1"

services:

  # Versions are pinned to the exact builds this stack was verified against —
  # WordPress 7.0.4, WP-CLI 2.12.0, MySQL 8.4.11, with WooCommerce 11.0.1 and
  # PHP 8.4. `latest` meant a routine `docker compose pull` could swap a major
  # version underneath the plugin with no changelog review, which is precisely
  # what CLAUDE.md's "pin versions once the environment is known-good" forbids.
  # Upgrade one image at a time, on a branch, and re-run the suites.
  #
  # Bumping the `wordpress` tag updates a *fresh* volume only: the image
  # entrypoint copies WordPress in solely when index.php and
  # wp-includes/version.php are both absent, so an existing install is upgraded
  # with `wp core update` and the tag is kept in step so the two never disagree.
  #
  # `db` is MySQL 8.4 LTS, upgraded in place from 8.0.46 after that line reached
  # end of life on 2026-04-30. 8.4 is supported to 2032-04-30.
  #
  # **There is no in-place downgrade.** Booting 8.4 against a volume upgrades it
  # irreversibly; retagging back to 8.0.46 will not work, because the data files
  # belong to 8.4 from the first boot. The only way back is a dump taken while
  # 8.0 was still running, restored into a fresh volume.
  #
  # Two things that must be true before any future major upgrade, learned here:
  # take and *verify* the dump by restoring it into a throwaway container of the
  # target version, and stop the database with `docker compose stop -t 120 db`.
  # The default 10s timeout kills mysqld mid-shutdown (exit 137), which turns
  # the next boot into crash recovery *and* a version upgrade at once.

  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.0.4-php8.4-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${WP_PORT:-8090}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      # WordPress refuses Application Passwords unless the request is HTTPS or
      # the environment declares itself local (wp_is_application_passwords_supported).
      # Development is plain HTTP, so without this the Next.js server cannot
      # authenticate at all. Staging and production run TLS and must override
      # this to "staging" / "production".
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
      # Plugin configuration read via getenv() in AlgerianCommerce\Core\Config.
      # Add feature flags (ENABLE_COD, ...) here the same way when needed.
      AC_CORS_ORIGINS: ${AC_CORS_ORIGINS:-}
      AC_LOG_LEVEL: ${AC_LOG_LEVEL:-}
      # Rate limits and the media size cap. Unset means the built-in defaults;
      # they are listed here for the same reason the credentials below are —
      # Config reads getenv(), so a value in .env that is not passed through
      # is a knob that turns nothing.
      AC_RATE_LIMIT_READS: ${AC_RATE_LIMIT_READS:-}
      AC_RATE_LIMIT_WRITES: ${AC_RATE_LIMIT_WRITES:-}
      AC_RATE_LIMIT_UPLOADS: ${AC_RATE_LIMIT_UPLOADS:-}
      # GET /orders/track only, per IP — roadmap §84. An unauthenticated read
      # whose key is a MAC does not belong on the 600-a-minute read allowance.
      AC_RATE_LIMIT_TRACKING: ${AC_RATE_LIMIT_TRACKING:-}
      AC_RATE_LIMIT_AUTH_FAILURES: ${AC_RATE_LIMIT_AUTH_FAILURES:-}
      AC_RATE_LIMIT_TRUSTED_IPS: ${AC_RATE_LIMIT_TRUSTED_IPS:-}
      # The upload cap in bytes. docker/php-uploads.ini raises PHP's own limit
      # to match; UploadPolicy takes the lower of the two.
      AC_MEDIA_MAX_BYTES: ${AC_MEDIA_MAX_BYTES:-}
      # How long an analytics response may be reused, in seconds. 0 disables
      # the cache; the test suite runs with it off so assertions see the shop
      # as it is. It is a cache, never a rollup — roadmap §63.
      AC_ANALYTICS_CACHE_TTL: ${AC_ANALYTICS_CACHE_TTL:-}
      AC_ADMIN_EMAIL: ${AC_ADMIN_EMAIL:-}
      AC_MAIL_FROM: ${AC_MAIL_FROM:-}
      # The mail transport. WordPress sends through PHP mail() unless something
      # configures PHPMailer, and neither container has an MTA — so without
      # these every send fails with "sendmail: can't connect". `MailTransport`
      # feeds them to WordPress; before it existed they were documented in
      # .env.example, read by Config, and passed through by nothing at all.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Provider credentials and feature flags. Config reads getenv(), so a
      # variable in .env reaches the plugin only if it is listed here — an
      # adapter whose keys are not passed through simply never registers, and
      # says nothing about why.
      #
      # Chargily takes one key: it authenticates API calls *and* signs the
      # webhooks, so there is no separate webhook secret. A key beginning
      # test_sk_ selects Chargily's test environment by itself.
      ENABLE_CHARGILY: ${ENABLE_CHARGILY:-}
      CHARGILY_SECRET_KEY: ${CHARGILY_SECRET_KEY:-}
      ENABLE_COD: ${ENABLE_COD:-}
      # Yalidine authenticates with two headers rather than a key/secret pair.
      ENABLE_YALIDINE: ${ENABLE_YALIDINE:-}
      YALIDINE_API_ID: ${YALIDINE_API_ID:-}
      YALIDINE_API_TOKEN: ${YALIDINE_API_TOKEN:-}
      YALIDINE_WEBHOOK_SECRET: ${YALIDINE_WEBHOOK_SECRET:-}
      # ZR Express: X-Tenant identifies the account, X-Api-Key authenticates it.
      ENABLE_ZR_EXPRESS: ${ENABLE_ZR_EXPRESS:-}
      ZR_EXPRESS_TENANT_ID: ${ZR_EXPRESS_TENANT_ID:-}
      ZR_EXPRESS_API_KEY: ${ZR_EXPRESS_API_KEY:-}
      ZR_EXPRESS_WEBHOOK_SECRET: ${ZR_EXPRESS_WEBHOOK_SECRET:-}
      # Marketing pixels — roadmap §62b. META_PIXEL_ID is public (it ships in
      # the storefront's JavaScript); META_CAPI_ACCESS_TOKEN authorises writing
      # conversions into an ad account and appears in no response ever.
      ENABLE_MARKETING_PIXELS: ${ENABLE_MARKETING_PIXELS:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/plugins/algerian-commerce-core:/var/www/html/wp-content/plugins/algerian-commerce-core
      - ./docker/apache-wordpress.conf:/etc/apache2/conf-enabled/zz-wordpress.conf:ro
      # The base image caps uploads at 2 MB, below this plugin's media cap and
      # below one photograph — see the file for why both numbers move together.
      - ./docker/php-uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro

  wpcli:
    image: wordpress:cli-2.12.0-php8.4
    # The two images disagree about who www-data is: the Debian `wordpress`
    # image uses uid 33, the Alpine `wordpress:cli` image uses uid 82. The
    # volume is owned 33:33, so WP-CLI could read everything and write nothing —
    # `wp core update` failed on wp-admin while `wp plugin update` succeeded
    # only because wp-content had been chmod 777 to work around this.
    #
    # Aligning the uid is the fix. Do not restore the 777: a world-writable
    # plugin directory is arbitrary code execution waiting for one other bug.
    user: "33:33"
    depends_on:
      - db
      - wordpress
    environment:
      # uid 33 has no home directory in the Alpine image, so WP-CLI cannot
      # create its default cache dir and warns on every command that downloads
      # anything. Somewhere writable and disposable is all it wants.
      WP_CLI_CACHE_DIR: /tmp/.wp-cli-cache
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      # WordPress refuses Application Passwords unless the request is HTTPS or
      # the environment declares itself local (wp_is_application_passwords_supported).
      # Development is plain HTTP, so without this the Next.js server cannot
      # authenticate at all. Staging and production run TLS and must override
      # this to "staging" / "production".
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
      # Plugin configuration read via getenv() in AlgerianCommerce\Core\Config.
      # Add feature flags (ENABLE_COD, ...) here the same way when needed.
      AC_CORS_ORIGINS: ${AC_CORS_ORIGINS:-}
      AC_LOG_LEVEL: ${AC_LOG_LEVEL:-}
      AC_RATE_LIMIT_READS: ${AC_RATE_LIMIT_READS:-}
      AC_RATE_LIMIT_WRITES: ${AC_RATE_LIMIT_WRITES:-}
      AC_RATE_LIMIT_UPLOADS: ${AC_RATE_LIMIT_UPLOADS:-}
      # GET /orders/track only, per IP — roadmap §84.
      AC_RATE_LIMIT_TRACKING: ${AC_RATE_LIMIT_TRACKING:-}
      AC_RATE_LIMIT_AUTH_FAILURES: ${AC_RATE_LIMIT_AUTH_FAILURES:-}
      AC_RATE_LIMIT_TRUSTED_IPS: ${AC_RATE_LIMIT_TRUSTED_IPS:-}
      AC_MEDIA_MAX_BYTES: ${AC_MEDIA_MAX_BYTES:-}
      # How long an analytics response may be reused, in seconds. 0 disables
      # the cache; the test suite runs with it off so assertions see the shop
      # as it is. It is a cache, never a rollup — roadmap §63.
      AC_ANALYTICS_CACHE_TTL: ${AC_ANALYTICS_CACHE_TTL:-}
      AC_ADMIN_EMAIL: ${AC_ADMIN_EMAIL:-}
      AC_MAIL_FROM: ${AC_MAIL_FROM:-}
      # The mail transport. WordPress sends through PHP mail() unless something
      # configures PHPMailer, and neither container has an MTA — so without
      # these every send fails with "sendmail: can't connect". `MailTransport`
      # feeds them to WordPress; before it existed they were documented in
      # .env.example, read by Config, and passed through by nothing at all.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Provider credentials and feature flags. Config reads getenv(), so a
      # variable in .env reaches the plugin only if it is listed here — an
      # adapter whose keys are not passed through simply never registers, and
      # says nothing about why.
      #
      # Chargily takes one key: it authenticates API calls *and* signs the
      # webhooks, so there is no separate webhook secret. A key beginning
      # test_sk_ selects Chargily's test environment by itself.
      ENABLE_CHARGILY: ${ENABLE_CHARGILY:-}
      CHARGILY_SECRET_KEY: ${CHARGILY_SECRET_KEY:-}
      ENABLE_COD: ${ENABLE_COD:-}
      # Yalidine authenticates with two headers rather than a key/secret pair.
      ENABLE_YALIDINE: ${ENABLE_YALIDINE:-}
      YALIDINE_API_ID: ${YALIDINE_API_ID:-}
      YALIDINE_API_TOKEN: ${YALIDINE_API_TOKEN:-}
      YALIDINE_WEBHOOK_SECRET: ${YALIDINE_WEBHOOK_SECRET:-}
      # ZR Express: X-Tenant identifies the account, X-Api-Key authenticates it.
      ENABLE_ZR_EXPRESS: ${ENABLE_ZR_EXPRESS:-}
      ZR_EXPRESS_TENANT_ID: ${ZR_EXPRESS_TENANT_ID:-}
      ZR_EXPRESS_API_KEY: ${ZR_EXPRESS_API_KEY:-}
      ZR_EXPRESS_WEBHOOK_SECRET: ${ZR_EXPRESS_WEBHOOK_SECRET:-}
      # Marketing pixels — roadmap §62b. META_PIXEL_ID is public (it ships in
      # the storefront's JavaScript); META_CAPI_ACCESS_TOKEN authorises writing
      # conversions into an ad account and appears in no response ever.
      ENABLE_MARKETING_PIXELS: ${ENABLE_MARKETING_PIXELS:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/plugins/algerian-commerce-core:/var/www/html/wp-content/plugins/algerian-commerce-core
      # Mounted here as well as in `wordpress`, so the two containers agree
      # about the upload cap. They are separate PHP installations, and the
      # plugin's effective cap is the lower of its own and PHP's — a limit that
      # differs depending on which container ran the code is not a limit.
      - ./docker/php-uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro

volumes:
  db_data:
  wordpress_data: