# Mounted over /etc/apache2/conf-enabled/remoteip.conf to disable it.
#
# **The `wordpress` image ships mod_remoteip enabled and trusting every RFC1918
# range**, which in Docker is every peer there is:
#
#   RemoteIPHeader X-Forwarded-For
#   RemoteIPInternalProxy 10.0.0.0/8
#   RemoteIPInternalProxy 172.16.0.0/12      <- the compose network
#   RemoteIPInternalProxy 192.168.0.0/16
#   RemoteIPInternalProxy 169.254.0.0/16
#   RemoteIPInternalProxy 127.0.0.0/8
#
# So Apache overwrites REMOTE_ADDR from a header the client wrote, before any
# PHP runs. Measured 2026-08-17 against this stack: a plain
# `curl -H 'X-Forwarded-For: 9.9.9.9, 8.8.8.8'` to the published port arrived
# with REMOTE_ADDR 8.8.8.8, and the failed login it carried was counted against
# that address instead of the caller's.
#
# What that costs, all of it silent:
#
#  - **Rate limiting becomes opt-out.** Every limit is keyed on the address, so
#    rotating one header gives a fresh allowance per request — the brute-force
#    lockout included.
#  - **The audit trail records fiction**, in the one table this project refuses
#    to update or delete.
#  - `Security\ClientIp` cannot help, because by the time PHP sees REMOTE_ADDR
#    the substitution has already happened and is indistinguishable from the
#    truth.
#
# Disabling it does not lose the capability — it moves it somewhere that can
# decide properly. With this off, REMOTE_ADDR is always the real TCP peer, and
# `ClientIp` resolves the forwarded client only when that peer is named in
# AC_TRUSTED_PROXIES. One mechanism, in the plugin, unit tested, and asserted
# over real HTTP by scripts/test-api.sh -> "forwarded headers".
#
# An empty override rather than `a2disconf`: this file is version-controlled and
# the image is not, so a rebuilt or re-pulled container cannot quietly get the
# default back.
