# Apache configuration for the WordPress container.
#
# The official wordpress image ships a vhost with AllowOverride None, so the
# .htaccess WordPress generates for pretty permalinks is ignored and every
# /wp-json/ request 404s. Declaring the rewrite here instead of relying on
# .htaccess keeps it reproducible: it lives in Git and applies to a fresh
# volume, where a container-written .htaccess would not exist.
#
# Mounted to /etc/apache2/conf-enabled/ by compose.yaml.

<Directory /var/www/html>
    AllowOverride All
    Require all granted

    # WordPress front controller — the standard rules WP writes to .htaccess.
    RewriteEngine On
    RewriteBase /
    RewriteRule ^index\.php$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]
</Directory>

# Nothing in wp-content/uploads is code — roadmap §61, docs/SECURITY.md
# "File uploads".
#
# POST /media already refuses anything that is not a JPEG, PNG or WebP by
# contents as well as by extension, and re-encodes what it accepts so an
# appended payload does not survive. This is the layer that does not depend on
# any of that being right: a directory the web server will happily execute is
# one bug — here, in WordPress, or in any other plugin that writes a file — away
# from arbitrary PHP execution inside the commerce backend.
#
# Deny first, and by pure core Apache, so this block is valid whether or not
# mod_php is loaded. `php_admin_flag` would abort Apache's startup on a
# php-fpm image, which is why it is guarded and second.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(?i:ph(p[0-9s]?|ar|tml?)|s?html?|cgi|pl|py|rb|sh|jsp|aspx?|htaccess)$">
        Require all denied
    </FilesMatch>

    <IfModule mod_php.c>
        php_admin_flag engine off
    </IfModule>
</Directory>
