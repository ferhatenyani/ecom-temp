; PHP upload limits for the WordPress container — roadmap §61.
;
; The php:8.4-apache base image ships upload_max_filesize = 2M, which is below
; a single photograph from a phone and well below this plugin's 8 MiB media cap.
; A cap the web server refuses first is not a cap: PHP discards the body before
; any application code runs, so `POST /media` would answer "the file is larger
; than this server accepts" for files it is configured to accept.
;
; UploadPolicy::withCap() takes the *lower* of AC_MEDIA_MAX_BYTES and
; wp_max_upload_size(), so these two numbers are the ceiling and the plugin's
; constant is the policy. Raise both together, never one alone.
;
; post_max_size must stay above upload_max_filesize: it bounds the whole
; multipart body, which is the file plus the alt text, title and caption
; travelling with it.
;
; Mounted read-only into /usr/local/etc/php/conf.d/ by compose.yaml.

upload_max_filesize = 16M
post_max_size = 20M

; A hostile client can open a multipart request and dribble bytes. The default
; is 60; nothing legitimate here needs a minute to send 16 MB.
max_input_time = 60
